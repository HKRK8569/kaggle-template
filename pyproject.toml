[project]
name = "kaggle-template"
version = "0.1.0"
description = "A small uv-based workspace for Kaggle competitions"
requires-python = ">=3.11"
dependencies = ["kaggle", "python-dotenv"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "catboost>=1.2.10",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "xgboost>=3.2.0",
]
